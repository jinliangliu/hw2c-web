name: Backend E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout hw2c-web
        uses: actions/checkout@v4

      - name: Checkout hw2c core
        uses: actions/checkout@v4
        with:
          repository: jinliangliu/hw2c
          path: hw2c
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip install -r hw2c/requirements.txt

      - name: Run parse -> generate regression test
        run: python -m pytest backend/tests -q --no-header
